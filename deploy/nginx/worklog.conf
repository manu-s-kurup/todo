# nginx site for WorkLog — reverse proxy to the pm2-managed Node app on 127.0.0.1:3000
#
# Install:
#   sudo cp deploy/nginx/worklog.conf /etc/nginx/sites-available/worklog.conf
#   sudo sed -i 's/todo.example.com/YOUR.DOMAIN/g' /etc/nginx/sites-available/worklog.conf
#   sudo ln -s /etc/nginx/sites-available/worklog.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR.DOMAIN      # adds HTTPS + HTTP->HTTPS redirect
#
# The app has NO login of its own, so this config protects it with HTTP Basic Auth.
# Create the password file first:
#   sudo htpasswd -c /etc/nginx/.htpasswd-worklog <username>

upstream worklog_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name todo.example.com;

    access_log /var/log/nginx/worklog.access.log;
    error_log  /var/log/nginx/worklog.error.log;

    client_max_body_size 1m;

    # --- Access control (remove these two lines only if you add real auth to the app) ---
    auth_basic           "WorkLog";
    auth_basic_user_file /etc/nginx/.htpasswd-worklog;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/csv image/svg+xml;

    # Long cache for the bundled chart library
    location /vendor/ {
        proxy_pass http://worklog_app;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://worklog_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check without auth (for uptime monitors)
    location = /api/health {
        auth_basic off;
        proxy_pass http://worklog_app;
        proxy_set_header Host $host;
    }
}
